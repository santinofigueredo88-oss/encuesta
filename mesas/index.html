<!doctype html>

<head>
<meta charset="utf-8">

<meta name="description" content="Buscá el apellido del egresado y encontrá las mesas de su familia de la Promo 2026.">

<title>Mesas Promo 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Saira:ital,wght@1,800;1,900&display=swap">
<style>
/* Layout: portada a pantalla completa con el loop 3D del Vegas Night detrás; buscador de vidrio con borde neón; resultados como el panel de precios de los flyers; abajo el plano del salón */
:root {
  --bg: #050203;
  --ink: #f8f1f3;
  --muted: #b9a3a8;
  --dim: #7d666b;
  --neon: #ff2440;
  --neon-hot: #ff5d72;
  --glass: rgba(22, 7, 10, .58);
  --glass-hi: rgba(40, 12, 17, .72);
  --edge: rgba(255, 70, 92, .28);
  --edge-soft: rgba(255, 255, 255, .07);
  --c1: #e9b44c;
  --c2: #ff4f6d;
  --c3: #a98bff;
  --c4: #3ad0b2;
  --display: "Saira", "Arial Black", Impact, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --chrome: linear-gradient(180deg, #ffffff 0%, #f1eff4 40%, #9a99a6 50%, #e4e1e8 64%, #ffe1e6 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.inner { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Portada */
.hero { position: relative; isolation: isolate; overflow: hidden; padding-block: 56px 40px; }
.hero video, .hero .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3; filter: saturate(1.15) brightness(.62) blur(1.5px); transform: scale(1.06); }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -2;
  background: radial-gradient(70% 55% at 50% 38%, rgba(5,2,3,.15), rgba(5,2,3,.78) 72%), linear-gradient(180deg, rgba(5,2,3,.35) 0%, rgba(5,2,3,.55) 55%, var(--bg) 100%); }
.hero::after { content: ""; position: absolute; left: 50%; top: -40%; width: 160%; height: 120%; translate: -50% 0; z-index: -1; pointer-events: none; opacity: .55; mix-blend-mode: screen;
  background: conic-gradient(from 180deg at 50% 0%, transparent 0 160deg, rgba(255,40,64,.22) 168deg, transparent 176deg, transparent 184deg, rgba(255,255,255,.12) 188deg, transparent 194deg, rgba(255,40,64,.2) 200deg, transparent 210deg 360deg);
  animation: beams 9s ease-in-out infinite alternate; transform-origin: 50% 0; }
@keyframes beams { from { rotate: -7deg; } to { rotate: 7deg; } }
.hero .inner { display: grid; justify-items: center; text-align: center; gap: 14px; }
.logo { width: min(520px, 86%); height: auto; filter: drop-shadow(0 10px 30px rgba(0,0,0,.6)) drop-shadow(0 0 28px rgba(255,36,64,.35)); }
.eyebrow { font-weight: 800; font-stretch: 125%; font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: #ffd0d7; text-shadow: 0 0 12px rgba(255,36,64,.6); }
h1 { margin: 2px 0 0; font-family: var(--display); font-style: italic; font-weight: 900; line-height: .92; letter-spacing: -.012em; font-size: clamp(44px, 10.5vw, 92px); text-wrap: balance;
  background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 1.5px 0 #ff2440) drop-shadow(0 0 1px #ff2440) drop-shadow(0 0 22px rgba(255,36,64,.75)); }
.lead { margin: 0; max-width: 44ch; color: #eadbde; font-size: 16px; }
.lead b { color: #fff; }

/* Buscador */
.search { width: 100%; max-width: 620px; margin-top: 14px; display: grid; gap: 12px; }
.field { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 20px; border-radius: 18px;
  background: var(--glass); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid var(--edge); box-shadow: 0 0 0 1px rgba(255,36,64,.15), 0 0 32px rgba(255,36,64,.28), inset 0 1px 0 rgba(255,255,255,.08); transition: box-shadow .2s, border-color .2s; }
.field:focus-within { border-color: rgba(255,93,114,.9); box-shadow: 0 0 0 1px var(--neon), 0 0 46px rgba(255,36,64,.55), inset 0 1px 0 rgba(255,255,255,.1); }
.field svg { flex: none; color: var(--neon-hot); filter: drop-shadow(0 0 6px rgba(255,36,64,.8)); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 19px; font-weight: 600; padding: 19px 0; letter-spacing: .005em; }
.field input::placeholder { color: #9a8287; font-weight: 500; }
.field input::-webkit-search-cancel-button { display: none; }
.clear { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06); color: var(--muted); display: grid; place-items: center; }
.clear:hover { background: rgba(255,255,255,.13); color: #fff; }
.go { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border: 0; border-radius: 13px;
  font-family: var(--display); font-style: italic; font-weight: 900; font-size: 19px; letter-spacing: .02em; color: #fff;
  background: linear-gradient(180deg, #ff5a6e 0%, #ff2440 45%, #c3001b 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.25), 0 0 0 1px rgba(255,120,135,.6), 0 6px 22px rgba(255,36,64,.55);
  text-shadow: 0 1px 0 rgba(90,0,12,.6); transition: transform .12s, box-shadow .15s, filter .15s; }
.go:hover { filter: brightness(1.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.25), 0 0 0 1px #ff8796, 0 8px 30px rgba(255,36,64,.75); }
.go:active { transform: translateY(1px) scale(.98); }
.go svg { filter: drop-shadow(0 1px 0 rgba(90,0,12,.5)); }
.filters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pill { position: relative; display: grid; justify-items: start; align-content: center; gap: 2px; min-height: 58px; padding: 9px 12px 9px 14px; border-radius: 14px; text-align: left;
  color: #eadbdf; background: linear-gradient(180deg, rgba(40,13,18,.7), rgba(16,5,8,.78)); border: 1px solid rgba(255,255,255,.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 8px 20px -12px #000; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: border-color .15s, box-shadow .15s, transform .12s, background .15s; }
.pill b { display: inline-flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 800; color: #fff; }
.pill small { font-size: 12px; font-weight: 600; color: var(--muted); padding-left: 15px; }
.pill.todos { justify-items: center; }
.pill.todos small { padding-left: 0; }
.pill:hover { border-color: color-mix(in srgb, var(--cc, #ff5d72) 60%, transparent); transform: translateY(-1px); }
.pill:active { transform: translateY(0) scale(.98); }
.pill[aria-pressed="true"] { background: linear-gradient(180deg, #ff4a60 0%, #e0102c 55%, #a80018 100%); border-color: #ff9aa6;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(255,36,64,.5), 0 0 26px rgba(255,36,64,.6); }
.pill[aria-pressed="true"] small { color: #ffe1e5; }
.pill[aria-pressed="true"] .dot { background: #fff; box-shadow: 0 0 8px #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); box-shadow: 0 0 8px var(--cc); flex: none; }
.k1 { --cc: var(--c1); } .k2 { --cc: var(--c2); } .k3 { --cc: var(--c3); } .k4 { --cc: var(--c4); }

/* Resultados */
main { display: grid; gap: 34px; padding-block: 8px 60px; }
.results { display: grid; gap: 12px; }
.rhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.rhead strong { color: #fff; }
.card { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px 20px; width: 100%; text-align: left;
  padding: 18px 18px 18px 22px; border-radius: 20px; background: linear-gradient(180deg, rgba(36,11,16,.85), rgba(16,5,8,.9)); border: 1px solid var(--edge-soft);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 40px -22px #000; transition: border-color .15s, box-shadow .15s, transform .15s; overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px; border-radius: 3px; background: var(--cc); box-shadow: 0 0 14px var(--cc); }
.card:hover { border-color: rgba(255,93,114,.45); transform: translateY(-1px); }
.card.on { border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon), 0 0 34px rgba(255,36,64,.35); }
.who { min-width: 0; display: grid; gap: 6px; }
.who strong { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 25px; line-height: 1.05; overflow-wrap: anywhere; }
.who small { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.tablero { display: grid; justify-items: center; gap: 2px; min-width: 132px; padding: 10px 18px 12px; border-radius: 14px; background: #0b0304;
  border: 1.5px solid rgba(255,70,92,.75); box-shadow: 0 0 0 1px rgba(255,36,64,.25), 0 0 26px rgba(255,36,64,.35), inset 0 0 22px rgba(255,36,64,.12); }
.tablero .lbl { font-size: 10.5px; font-weight: 800; font-stretch: 125%; letter-spacing: .3em; text-transform: uppercase; color: #ff8b9b; }
.tablero .num { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums;
  background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 #ff2440) drop-shadow(0 0 10px rgba(255,36,64,.7)); }
.tablero .num i { font-style: normal; font-size: .55em; padding: 0 .12em; }
.solo .card { padding: 24px 24px 24px 28px; }
.solo .who strong { font-size: 30px; }
.solo .tablero { min-width: 170px; padding: 14px 22px 16px; }
.solo .tablero .num { font-size: 54px; }
.vacio { display: grid; gap: 6px; padding: 24px; border-radius: 20px; text-align: center; background: rgba(20,7,10,.6); border: 1px dashed rgba(255,70,92,.35); }
.vacio strong { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; }
.vacio p { margin: 0; color: var(--muted); font-size: 14.5px; }
.tip { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 0; color: var(--muted); font-size: 14px; }
.tip button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #fff;
  background: rgba(255,36,64,.12); border: 1px solid rgba(255,70,92,.5); box-shadow: 0 0 14px rgba(255,36,64,.2); transition: background .15s, box-shadow .15s; }
.tip button:hover { background: rgba(255,36,64,.25); box-shadow: 0 0 20px rgba(255,36,64,.45); }
.ver { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: 6px; justify-self: start; font-size: 12.5px; font-weight: 700; color: #ff9aa7; letter-spacing: .02em; }
.ver svg { transition: transform .15s; }
.card:hover .ver svg { transform: translateY(2px); }

/* Plano */
.salon { position: relative; border-radius: 26px; padding: 26px 22px 22px; display: grid; gap: 18px; overflow: hidden;
  background: radial-gradient(90% 60% at 50% 0%, rgba(255,36,64,.12), transparent 70%), linear-gradient(180deg, #12060a, #0a0405); border: 1px solid var(--edge-soft); }
.shead { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
.salon h2 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 30px; line-height: 1;
  background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 12px rgba(255,36,64,.45)); }
.shead p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.cupo { font-size: 12.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--edge-soft); border-radius: 999px; padding: 6px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cupo b { color: #fff; }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.leyenda span { display: inline-flex; align-items: center; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
.mesa { aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 12px; display: grid; place-content: center; justify-items: center; gap: 5px; font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums;
  color: color-mix(in srgb, var(--cc) 75%, #fff); background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 20%, #140609), color-mix(in srgb, var(--cc) 9%, #0a0304));
  border: 1px solid color-mix(in srgb, var(--cc) 38%, transparent); transition: transform .12s, opacity .2s, box-shadow .2s; }
.mesa:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--cc) 80%, transparent); }
.mesa .n { font-family: var(--display); font-style: italic; font-weight: 900; line-height: 1; }
.mesa .pts { display: flex; gap: 3px; }
.mesa .pts i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.tablero .cant { font-size: 12px; font-weight: 700; color: #ffc2ca; margin-top: 2px; text-align: center; }
.mesa.libre { --cc: #6a5559; color: #6f5c60; background: transparent; border-style: dashed; }
.grid.foco .mesa:not(.hit) { opacity: .3; }
.mesa.hit { color: #fff; background: linear-gradient(180deg, #ff4058, #c8001d); border-color: #ffb0ba; box-shadow: 0 0 0 2px rgba(255,36,64,.4), 0 0 22px rgba(255,36,64,.9); transform: scale(1.08); z-index: 1; animation: latido 1.6s ease-in-out infinite; }
@keyframes latido { 50% { box-shadow: 0 0 0 4px rgba(255,36,64,.25), 0 0 32px rgba(255,36,64,1); } }
.detalle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 18px; border-radius: 14px; background: rgba(255,36,64,.1); border: 1px solid rgba(255,70,92,.45); }
.detalle b { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 19px; }
.detalle p { margin: 2px 0 0; color: #e6cfd4; font-size: 13.5px; }
.detalle button { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08); }
footer { text-align: center; color: var(--dim); font-size: 13px; padding-bottom: 8px; }
.espera { display: grid; gap: 4px; padding: 16px 18px; border-radius: 16px; background: rgba(255,36,64,.08); border: 1px dashed rgba(255,70,92,.45); }
.espera b { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 19px; }
.espera span { color: var(--muted); font-size: 14px; }
.tablero .num.q { font-size: 34px; }
.tablero .pend { font-size: 11.5px; font-weight: 700; color: #ffc2ca; text-align: center; }
.imprimir { min-height: 44px; justify-items: center; }
.tabla-wrap { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tabla th { text-align: left; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.18); }
.tabla td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.06); }
.tabla td.n { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 20px; color: #fff; text-shadow: 0 0 10px rgba(255,36,64,.7); width: 64px; font-variant-numeric: tabular-nums; }
.tabla td.c { color: var(--muted); white-space: nowrap; }
.tabla td.m { white-space: nowrap; }
.tabla td .dot { display: inline-block; margin-right: 7px; vertical-align: middle; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff !important; color: #111 !important; }
  .hero, .results, .salon:not(.lista-sec), footer, .imprimir { display: none !important; }
  main { padding: 0 !important; }
  .lista-sec { background: none !important; border: 0 !important; padding: 0 !important; }
  .lista-sec h2 { color: #111 !important; -webkit-text-fill-color: #111; background: none !important; filter: none !important; }
  .lista-sec .shead p { color: #444 !important; }
  .tabla { font-size: 11pt; }
  .tabla th { color: #555 !important; border-bottom: 1.5px solid #111 !important; }
  .tabla td { border-bottom: 1px solid #ddd !important; color: #111 !important; padding: 5px 8px; }
  .tabla td.n { color: #c3001b !important; text-shadow: none !important; }
  .tabla td.c { color: #555 !important; }
  .tabla tr { break-inside: avoid; }
  .tabla td .dot { print-color-adjust: exact; -webkit-print-color-adjust: exact; box-shadow: none; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 620px) {
  .hero { padding-block: 40px 28px; }
  .eyebrow { font-size: 11px; letter-spacing: .18em; }
  .field { padding-left: 14px; }
  .field input { font-size: 17px; padding: 14px 0; }
  .go { height: 46px; padding: 0 16px; font-size: 17px; }
  .go span { display: none; }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pill.todos { grid-column: 1 / -1; min-height: 44px; }
  .pill.todos small { display: none; }
  .card { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 16px 16px 16px 20px; }
  .tablero { justify-self: stretch; grid-template-columns: auto 1fr; align-items: center; justify-items: start; gap: 14px; padding: 10px 16px; }
  .tablero .num { font-size: 36px; justify-self: end; }
  .solo .tablero .num { font-size: 46px; }
  .solo .who strong { font-size: 26px; }
  .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .mesa { font-size: 16px; border-radius: 10px; }
  .tablero { grid-template-columns: auto 1fr; }
  .tablero .cant { grid-column: 1 / -1; justify-self: end; text-align: right; }
  .tablero .pend { grid-column: 1 / -1; justify-self: end; text-align: right; }
  .tablero .num.q { font-size: 28px; }
  .salon { padding: 20px 14px 16px; border-radius: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero::after, .mesa.hit { animation: none; }
  .card, .mesa, .field { transition: none; }
}
</style>
</head>
<body>


<header class="hero">
  <img class="poster" src="fondo.jpg" alt="">
  <video id="fondo" src="fondo.mp4" poster="fondo.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
  <div class="inner">
    <img class="logo" src="logo-indu26.webp" alt="Indu 26" width="1400" height="316">
    <div class="eyebrow">Promo 2026 · Indu 26</div>
    <h1>Encontrá tu mesa</h1>
    <p class="lead">Escribí el <b>apellido completo del egresado</b> que te invitó y te mostramos el número de mesa de su familia.</p>
    <form class="search" id="form" role="search">
      <label class="sr" for="q">Apellido o nombre del egresado</label>
      <div class="field">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Apellido del egresado">
        <button class="clear" type="button" id="clear" aria-label="Borrar búsqueda" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button class="go" type="submit" aria-label="Buscar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><span>Buscar</span></button>
      </div>
    </form>
  </div>
</header>

<main class="inner">
  <section class="results" id="results" aria-live="polite"></section>

  <footer>¿No encontrás al egresado? Consultá con la organización de la promo en la entrada.</footer>
</main>

<script>
const CURSOS = {
  "7mo 1ra": { k: 1, area: "Mecánica" },
  "7mo 2da": { k: 2, area: "Química" },
  "7mo 3ra": { k: 3, area: "Mecánica" },
  "7mo 4ta": { k: 4, area: "Programación" },
};
// El resultado del sorteo está en sorteo.json, cifrado por apellido: solo se puede leer
// la mesa de una familia escribiendo su apellido (o su nombre y apellido) completo.
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const te = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function idDe(t) { return hex(await crypto.subtle.digest("SHA-256", te.encode("indu26-id|" + t))).slice(0, 32); }
async function claveDe(t) { const raw = await crypto.subtle.digest("SHA-256", te.encode("indu26-clave|" + t)); return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]); }

const $ = id => document.getElementById(id);
const q = $("q"), results = $("results");
let datos = null, estado = "cargando";

async function cargarSorteo() {
  let d = null;
  try { const r = await fetch("sorteo.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) d = await r.json(); } catch (e) {}
  const nuevo = d && d.estado === "hecho" && Array.isArray(d.entradas) ? "hecho" : d ? "pendiente" : "error";
  const cambio = nuevo !== estado || (nuevo === "hecho" && d.actualizado !== datos?.actualizado);
  estado = nuevo; datos = nuevo === "hecho" ? d : null;
  if (cambio && q.value.trim()) buscar();
}

function tarjeta(x) {
  const c = CURSOS[x.curso] || { k: 2, area: "" };
  return `<div class="card k${c.k}">
    <span class="who"><strong>${esc(x.nombre)}</strong><small><i class="dot"></i>${esc(x.curso)}${c.area ? " · " + c.area : ""}</small></span>
    <span class="tablero"><span class="lbl">Mesa</span><span class="num">${Number(x.n)}</span><span class="cant">${x.cant === 1 ? "1 mesa" : Number(x.cant) + " mesas con este número"}</span></span>
    <span class="sr">Mesa ${Number(x.n)}${x.cant > 1 ? `, ${Number(x.cant)} mesas con ese número` : ""}</span>
  </div>`;
}

let busqueda = 0;
async function buscar() {
  const t = norm(q.value), yo = ++busqueda;
  $("clear").hidden = !q.value;
  if (!t) { results.innerHTML = `<p class="tip">Escribí el apellido completo y tocá <b>&nbsp;Buscar</b>.</p>`; return; }
  if (estado === "cargando") { results.innerHTML = `<p class="tip">Cargando…</p>`; await cargarSorteo(); if (yo !== busqueda) return; }
  if (estado === "error") { results.innerHTML = `<div class="vacio"><strong>No se pudo cargar</strong><p>Revisá la conexión y probá de nuevo en un momento.</p></div>`; return; }
  if (estado === "pendiente") { results.innerHTML = `<div class="vacio"><strong>Todavía no se hizo el sorteo</strong><p>Los números de mesa se publican apenas se sortean. Volvé a entrar más tarde.</p></div>`; return; }
  const palabras = t.split(" ").filter(w => w.length >= 2);
  const terminos = [...new Set([t, ...palabras.filter(w => w.length >= 3)])];
  const hallados = new Map();
  for (const term of terminos) {
    const id = await idDe(term); const filas = datos.entradas.filter(e => e.k === id);
    if (!filas.length) continue;
    const clave = await claveDe(term);
    for (const e of filas) {
      try { const txt = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(e.iv) }, clave, b64d(e.d)));
        const x = JSON.parse(txt); if (palabras.every(w => norm(x.nombre).split(" ").includes(w))) hallados.set(x.nombre + "|" + x.n, x); } catch (err) {}
    }
  }
  if (yo !== busqueda) return;
  const lista = [...hallados.values()].sort((a, b) => a.n - b.n);
  results.classList.toggle("solo", lista.length === 1);
  if (!lista.length) {
    results.innerHTML = `<div class="vacio"><strong>No encontramos «${esc(q.value.trim())}»</strong><p>Escribí el apellido completo, tal como está en la lista de la promo. Si es un apellido compuesto, probá con una sola de sus partes.</p></div>`;
    return;
  }
  results.innerHTML = `<div class="rhead"><span><strong>${lista.length}</strong> ${lista.length === 1 ? "familia" : "familias con ese apellido"}</span></div>` + lista.map(tarjeta).join("");
}

$("form").addEventListener("submit", e => { e.preventDefault(); q.blur(); buscar(); });
let tm = null;
q.addEventListener("input", () => { $("clear").hidden = !q.value; clearTimeout(tm); if (!q.value.trim()) buscar(); else tm = setTimeout(() => { if (norm(q.value).length >= 3) buscar(); }, 450); });
$("clear").addEventListener("click", () => { q.value = ""; buscar(); q.focus(); });

const v = $("fondo");
if (matchMedia("(prefers-reduced-motion: reduce)").matches) { v.removeAttribute("autoplay"); v.pause(); }
else { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
v.addEventListener("playing", () => { const im = document.querySelector(".hero .poster"); if (im) im.hidden = true; });

buscar();
cargarSorteo();
setInterval(() => { if (document.visibilityState === "visible") cargarSorteo(); }, 60000);
</script>

</body>
</html>
